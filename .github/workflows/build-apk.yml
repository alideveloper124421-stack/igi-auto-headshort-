name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          GRADLEW_PATH=$(find . -maxdepth 3 -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            cd "$(dirname "$GRADLEW_PATH")"
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: igi-debug-apk
          path: "**/app/build/outputs/apk/debug/*.apk"

      - name: Publish to latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH=$(find . -path "*/app/build/outputs/apk/debug/*.apk" | head -n 1)
          cp "$APK_PATH" igi-debug.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest igi-debug.apk \
            --title "Latest Debug Build" \
            --notes "Auto-built from commit ${{ github.sha }}"
