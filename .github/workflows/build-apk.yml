name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            STORE_PASS=$(grep -E "storePassword" app/build.gradle* 2>/dev/null | grep -Ev "getenv|Property" | head -n 1 | sed -E 's/.*["'\'']([^"'\'']+)["'\''].*/\1/')
            KEY_PASS=$(grep -E "keyPassword" app/build.gradle* 2>/dev/null | grep -Ev "getenv|Property" | head -n 1 | sed -E 's/.*["'\'']([^"'\'']+)["'\''].*/\1/')
            KEY_ALIAS=$(grep -E "keyAlias" app/build.gradle* 2>/dev/null | grep -Ev "getenv|Property" | head -n 1 | sed -E 's/.*["'\'']([^"'\'']+)["'\''].*/\1/')
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass "${STORE_PASS:-android}" \
              -alias "${KEY_ALIAS:-androiddebugkey}" \
              -keypass "${KEY_PASS:-android}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: igi-debug-apk
          path: "**/app/build/outputs/apk/debug/*.apk"

      - name: Publish to latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH=$(find . -path "*/app/build/outputs/apk/debug/*.apk" | head -n 1)
          cp "$APK_PATH" igi-debug.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest igi-debug.apk \
            --title "Latest Debug Build" \
            --notes "Auto-built from commit ${{ github.sha }}"
